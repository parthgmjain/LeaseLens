[project]
name = "leaselens"
version = "0.1.0"
description = "California tenant-rights RAG assistant"
readme = "README.md"
authors = [
    { name = "Parth Jain", email = "parthgmjain@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "lxml>=6.1.3",
    "openai>=3.40.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
leaselens = "leaselens.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
