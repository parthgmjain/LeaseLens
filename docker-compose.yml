services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: leaselens
      POSTGRES_PASSWORD: leaselens
      POSTGRES_DB: leaselens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
